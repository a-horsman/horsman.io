<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adam Horsman</title>
<meta name="description" content="Adam Horsman — personal site.">
<meta name="theme-color" content="#07070A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070A;
    --ink: #F4F2EE;
    --dim: rgba(244,242,238,.56);
    --line: rgba(244,242,238,.16);
    --serif: 'Instrument Serif', 'Times New Roman', serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas#light {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    display: block;
    touch-action: none;
  }
  .grain {
    position: fixed; inset: -50%;
    pointer-events: none; opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 1.2s steps(6) infinite;
  }
  @keyframes grain {
    0% { transform: translate(0,0); } 20% { transform: translate(-3%,2%); } 40% { transform: translate(2%,-3%); }
    60% { transform: translate(-2%,-1%); } 80% { transform: translate(3%,3%); } 100% { transform: translate(0,0); }
  }

  .frame {
    position: fixed; inset: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(18px, 3.4vw, 40px);
    pointer-events: none;
    mix-blend-mode: difference;
  }
  .frame a, .frame button { pointer-events: auto; }

  header, footer {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
  }
  .mono-mark {
    font-family: var(--serif); font-style: italic; text-transform: none; letter-spacing: 0;
    font-size: 26px; color: var(--ink);
  }
  .coords { font-variant-numeric: tabular-nums; }

  main {
    align-self: center;
    display: flex; flex-direction: column; align-items: flex-start;
    gap: clamp(14px, 2.4vw, 26px);
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(64px, 15vw, 220px);
    line-height: .86;
    letter-spacing: -.02em;
    color: #fff;
  }
  h1 em { font-style: italic; }
  .tagline {
    margin: 0;
    max-width: 44ch;
    font-size: clamp(13px, 1.3vw, 15px);
    line-height: 1.7;
    color: var(--dim);
  }

  nav.links { display: flex; flex-wrap: wrap; gap: 8px 22px; }
  nav.links a {
    color: var(--ink); text-decoration: none;
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px;
    border-bottom: 1px solid var(--line);
    transition: border-color .3s ease, color .3s ease;
  }
  nav.links a:hover { border-color: var(--ink); }
  nav.links a:focus-visible { outline: 1px solid var(--ink); outline-offset: 6px; }
  nav.links a span.arrow { transition: transform .3s ease; display: inline-block; }
  nav.links a:hover span.arrow { transform: translate(2px,-2px); }

  .hint {
    display: inline-flex; align-items: center; gap: 10px;
    transition: opacity .8s ease;
  }
  .hint .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  .hint.gone { opacity: 0; }

  @media (max-width: 640px) {
    header .coords { display: none; }
    footer { flex-direction: column-reverse; align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    .grain, .hint .dot { animation: none; }
  }
</style>
</head>
<body>
<canvas id="light" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<div class="frame">
  <header>
    <span class="mono-mark">A.H.</span>
    <span class="coords" id="coords" aria-hidden="true">x 000 · y 000</span>
  </header>

  <main>
    <h1>Adam<br><em>Horsman</em></h1>
    <!-- Replace with a line about yourself -->
    <p class="tagline">[A short line about what you do and what you're into.]</p>
  </main>

  <footer>
    <nav class="links" aria-label="Links">
      <!-- Replace the # with your real links -->
      <a href="mailto:adam@horsman.io">Email <span class="arrow">↗</span></a>
      <a href="https://www.linkedin.com/in/adamhorsman" target="_blank" rel="noopener">LinkedIn <span class="arrow">↗</span></a>
    </nav>
    <span class="hint" id="hint"><span class="dot"></span><span id="hint-text">Move across the page</span></span>
  </footer>
</div>

<script>
(function () {
  var canvas = document.getElementById('light');
  var coords = document.getElementById('coords');
  var hint = document.getElementById('hint');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (matchMedia('(pointer: coarse)').matches) document.getElementById('hint-text').textContent = 'Drag across the page';

  // ---------- pointer state ----------
  var pointer = { x: 0.5, y: 0.5, px: 0.5, py: 0.5, active: false, last: 0, moved: false };
  var auto = true, t0 = performance.now();
  function setPointer(cx, cy) {
    var x = cx / innerWidth, y = 1 - cy / innerHeight;
    if (!pointer.moved) { pointer.px = x; pointer.py = y; }
    pointer.x = x; pointer.y = y; pointer.moved = true;
    pointer.last = performance.now(); auto = false;
    coords.textContent = 'x ' + String(Math.round(cx)).padStart(3, '0') + ' · y ' + String(Math.round(cy)).padStart(3, '0');
    if (!hint.classList.contains('gone')) hint.classList.add('gone');
  }
  addEventListener('pointermove', function (e) { setPointer(e.clientX, e.clientY); }, { passive: true });
  addEventListener('pointerdown', function (e) { pointer.moved = false; setPointer(e.clientX, e.clientY); }, { passive: true });
  canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  var gl = canvas.getContext('webgl', { premultipliedAlpha: false, antialias: false, preserveDrawingBuffer: false });
  if (!gl) { fallback2D(); return; }

  // ---------- shaders ----------
  var VS = 'attribute vec2 p; varying vec2 uv; void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }';

  // Light field: decays, diffuses, gets fed by the pointer stroke
  var FS_UPDATE = [
    'precision highp float;',
    'varying vec2 uv;',
    'uniform sampler2D prev; uniform vec2 texel; uniform vec2 a; uniform vec2 b;',
    'uniform float aspect; uniform float radius; uniform float strength; uniform float decay;',
    'float segDist(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-6),0.,1.); return length(pa-ba*h); }',
    'void main(){',
    '  float c = texture2D(prev, uv).r;',
    '  float n = texture2D(prev, uv+vec2(texel.x,0.)).r + texture2D(prev, uv-vec2(texel.x,0.)).r',
    '          + texture2D(prev, uv+vec2(0.,texel.y)).r + texture2D(prev, uv-vec2(0.,texel.y)).r;',
    '  float v = mix(c, n*0.25, 0.35) * decay;',
    '  vec2 p = vec2(uv.x*aspect, uv.y);',
    '  float d = segDist(p, vec2(a.x*aspect,a.y), vec2(b.x*aspect,b.y));',
    '  v += strength * exp(-(d*d)/(radius*radius));',
    '  gl_FragColor = vec4(min(v, 1.0), 0., 0., 1.);',
    '}'
  ].join('\n');

  // Display: split the light into a spectrum along its gradient, like a prism
  var FS_DISPLAY = [
    'precision highp float;',
    'varying vec2 uv;',
    'uniform sampler2D field; uniform vec2 texel; uniform float time; uniform float spread;',
    'vec3 spectrum(float w){',
    '  vec3 c = clamp(vec3(abs(w*6.-3.)-1., 2.-abs(w*6.-2.), 2.-abs(w*6.-4.)), 0., 1.);',
    '  return c*c*(3.-2.*c);',
    '}',
    'float I(vec2 q){ return texture2D(field, q).r; }',
    'void main(){',
    '  vec2 e = texel*2.5;',
    '  vec2 g = vec2(I(uv+vec2(e.x,0.))-I(uv-vec2(e.x,0.)), I(uv+vec2(0.,e.y))-I(uv-vec2(0.,e.y)));',
    '  vec2 dir = g * spread;',
    '  vec3 col = vec3(0.); vec3 norm = vec3(0.);',
    '  for (int i = 0; i < 16; i++) {',
    '    float w = (float(i)+0.5)/16. * 0.8;',
    '    vec3 s = spectrum(w);',
    '    float k = I(uv + dir*(w-0.4));',
    '    col += s * k; norm += s;',
    '  }',
    '  col /= norm;',
    '  float core = I(uv);',
    '  float edge = clamp(length(g)*6.0, 0., 1.);',
    '  col = mix(vec3(core), col, 0.55 + 0.45*edge) * 1.25;',
    '  col = 1.0 - exp(-col*1.8);',
    '  vec2 c = uv-0.5; float vig = 1.0 - dot(c,c)*0.9;',
    '  vec3 base = vec3(0.027,0.027,0.039) * vig;',
    '  gl_FragColor = vec4(base + col, 1.0);',
    '}'
  ].join('\n');

  function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
  function prog(fs) {
    var p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw gl.getProgramInfoLog(p);
    var u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (var i = 0; i < n; i++) { var name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
    return { p: p, u: u };
  }
  var update, display;
  try { update = prog(FS_UPDATE); display = prog(FS_DISPLAY); } catch (err) { console.warn(err); fallback2D(); return; }

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  // Prefer half-float targets for smooth fades; fall back to bytes
  var hf = gl.getExtension('OES_texture_half_float');
  gl.getExtension('OES_texture_half_float_linear');
  var texType = hf ? hf.HALF_FLOAT_OES : gl.UNSIGNED_BYTE;

  var W, H, targets = [];
  function makeTarget(w, h) {
    var t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, texType, null);
    var f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE && texType !== gl.UNSIGNED_BYTE) {
      texType = gl.UNSIGNED_BYTE; return makeTarget(w, h);
    }
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    return { t: t, f: f };
  }
  function resize() {
    var dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    W = Math.max(2, Math.floor(innerWidth / 2)); H = Math.max(2, Math.floor(innerHeight / 2));
    targets.forEach(function (x) { gl.deleteTexture(x.t); gl.deleteFramebuffer(x.f); });
    targets = [makeTarget(W, H), makeTarget(W, H)];
  }
  addEventListener('resize', resize);
  resize();

  var cur = 0;
  function frame(now) {
    var t = (now - t0) / 1000;
    // Ghost light drifts on its own until someone moves, and again after a pause
    if (!auto && now - pointer.last > 5000) { auto = true; }
    var ax = pointer.px, ay = pointer.py, bx = pointer.x, by = pointer.y, s = 0;
    if (auto && !reduce) {
      var nx = 0.5 + 0.34 * Math.sin(t * 0.43) * Math.cos(t * 0.17);
      var ny = 0.5 + 0.30 * Math.sin(t * 0.31 + 1.3);
      ax = pointer.ax !== undefined ? pointer.ax : nx; ay = pointer.ay !== undefined ? pointer.ay : ny;
      bx = nx; by = ny; pointer.ax = nx; pointer.ay = ny; s = 0.06;
    } else if (pointer.moved) {
      var dx = (bx - ax), dy = (by - ay);
      var speed = Math.min(Math.sqrt(dx * dx + dy * dy) * 60, 1);
      s = 0.05 + 0.20 * speed;
      pointer.ax = undefined; pointer.ay = undefined;
    }
    pointer.px = pointer.x; pointer.py = pointer.y;

    // update pass
    var src = targets[cur], dst = targets[1 - cur];
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.f);
    gl.viewport(0, 0, W, H);
    gl.useProgram(update.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.t);
    gl.uniform1i(update.u.prev, 0);
    gl.uniform2f(update.u.texel, 1 / W, 1 / H);
    gl.uniform2f(update.u.a, ax, ay);
    gl.uniform2f(update.u.b, bx, by);
    gl.uniform1f(update.u.aspect, innerWidth / innerHeight);
    gl.uniform1f(update.u.radius, 0.045 * Math.min(1, (innerWidth / innerHeight) * 1.3));
    gl.uniform1f(update.u.strength, s);
    gl.uniform1f(update.u.decay, texType === gl.UNSIGNED_BYTE ? 0.975 : 0.982);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    cur = 1 - cur;

    // display pass
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(display.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, dst.t);
    gl.uniform1i(display.u.field, 0);
    gl.uniform2f(display.u.texel, 1 / W, 1 / H);
    gl.uniform1f(display.u.time, t);
    gl.uniform1f(display.u.spread, 1.6);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- 2D fallback for browsers without WebGL ----------
  function fallback2D() {
    var ctx = canvas.getContext('2d');
    function size() { canvas.width = innerWidth; canvas.height = innerHeight; ctx.fillStyle = '#07070A'; ctx.fillRect(0, 0, innerWidth, innerHeight); }
    addEventListener('resize', size); size();
    var hue = 0;
    (function loop() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(7,7,10,0.06)'; ctx.fillRect(0, 0, innerWidth, innerHeight);
      if (pointer.moved && performance.now() - pointer.last < 120) {
        ctx.globalCompositeOperation = 'lighter';
        var x = pointer.x * innerWidth, y = (1 - pointer.y) * innerHeight;
        for (var i = 0; i < 6; i++) {
          var g = ctx.createRadialGradient(x + (i - 2.5) * 3, y, 0, x + (i - 2.5) * 3, y, 60);
          g.addColorStop(0, 'hsla(' + ((hue + i * 50) % 360) + ',90%,60%,0.18)'); g.addColorStop(1, 'hsla(0,0%,0%,0)');
          ctx.fillStyle = g; ctx.fillRect(x - 70, y - 70, 140, 140);
        }
        hue = (hue + 2) % 360;
      }
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
